<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPB Config Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="icon"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            </div>
            <h1>BPB Config Converter</h1>
            <p class="subtitle">Add Fragment, CipherSuites, and Fingerprint to your V2Ray Subscription.</p>
        </header>
        
        <main>
            <div class="info-box">
                <div class="info-content">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="info-icon"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                    <div class="info-text">
                        <strong>Note:</strong> The supported subscription link must be of type <strong>Raw</strong> (Plain text or Raw Base64 format), like the example below:
                    </div>
                </div>
                <img src="raw-example.png" alt="Raw Subscription Example" class="info-image">
            </div>

            <div class="input-group">
                <label for="subUrl">Subscription Link or Raw Config</label>
                <div class="input-wrapper">
                    <input type="text" id="subUrl" placeholder="https://.../sub/raw OR paste config/base64 here" required>
                </div>
            </div>
            
            <button id="convertBtn" class="primary-btn">
                <span>Fetch & Convert</span>
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>

            <div id="statusMessage" class="hidden"></div>
            
            <div class="output-group hidden" id="outputGroup">
                <label for="outputResult">Converted Configs</label>
                <div class="textarea-wrapper">
                    <textarea id="outputResult" rows="10" readonly></textarea>
                </div>
                <button id="copyBtn" class="secondary-btn">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    <span>Copy All</span>
                </button>
            </div>
        </main>
        
        <footer>
            <p>Runs entirely in your browser. <br>Designed for GitHub Pages.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
